name: Publish validated release
on:
  workflow_dispatch:
    inputs:
      validation-run-id:
        description: Successful exact validation run ID (direct dispatch or CI push caller)
        required: true
        type: string
      revision:
        description: Validated commit (40 lowercase hexadecimal characters)
        required: true
        type: string
      version:
        description: Stable release version
        required: true
        default: '0.6.0'
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-scrinia-0.6.0
  cancel-in-progress: false
env:
  DOTNET_NOLOGO: 'true'
  MSBUILDDISABLENODEREUSE: '1'
  RELEASE_REVISION: ${{ inputs.revision }}
  VALIDATION_RUN_ID: ${{ inputs.validation-run-id }}
  RELEASE_VERSION: ${{ inputs.version }}
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      validator-sha256: ${{ steps.validator.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.203'
      - name: Prepare isolated nonshipping publication validator
        id: validator
        shell: pwsh
        run: |
          if ($env:RELEASE_REVISION -cnotmatch '\A[0-9a-f]{40}\z' -or $env:VALIDATION_RUN_ID -cnotmatch '\A[1-9][0-9]*\z' -or $env:RELEASE_VERSION -cne '0.6.0') { throw 'Exact stable release identity required' }
          if ((git rev-parse HEAD).Trim() -cne $env:RELEASE_REVISION -or (dotnet --version).Trim() -cne '10.0.203') { throw 'Preflight checkout or SDK differs' }
          dotnet build tools/Scrinia.ReleaseTools/Scrinia.ReleaseTools.csproj -c Release -p:PublicationOnly=true --artifacts-path "$env:RUNNER_TEMP/validator-build" --output "$env:RUNNER_TEMP/validator"
          if ($LASTEXITCODE -ne 0) { throw 'Publication validator build failed' }
          Compress-Archive -Path "$env:RUNNER_TEMP/validator/*" -DestinationPath "$env:RUNNER_TEMP/publication-validator.zip"
          "sha256=$((Get-FileHash "$env:RUNNER_TEMP/publication-validator.zip" -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with:
          name: validated-release-${{ inputs.validation-run-id }}-${{ inputs.revision }}
          run-id: ${{ inputs.validation-run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/validated-release
      - name: Read-only run, tag and artifact eligibility
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/release/Publish-ValidatedRelease.ps1 -ValidationRunId $env:VALIDATION_RUN_ID -Revision $env:RELEASE_REVISION -Version $env:RELEASE_VERSION -ArtifactRoot "$env:RUNNER_TEMP/validated-release/artifacts" -ProgressPath "$env:RUNNER_TEMP/preflight-progress.json" -ValidatorPath "$env:RUNNER_TEMP/validator/Scrinia.ReleaseTools.dll" -ValidateOnly
      - uses: actions/upload-artifact@v4
        with:
          name: publication-validator-${{ github.run_id }}
          path: ${{ runner.temp }}/publication-validator.zip
          if-no-files-found: error
  publish:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Configure reviewers and owner attestations manually in the release environment.
    # Missing public package metadata never grants publishing authority.
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.203'
      - uses: actions/download-artifact@v4
        with:
          name: publication-validator-${{ github.run_id }}
          path: ${{ runner.temp }}/validator-transfer
      - name: Verify transferred publication validator
        shell: pwsh
        env:
          VALIDATOR_SHA256: ${{ needs.preflight.outputs.validator-sha256 }}
        run: |
          if ((git rev-parse HEAD).Trim() -cne $env:RELEASE_REVISION -or (dotnet --version).Trim() -cne '10.0.203') { throw 'Publication checkout or SDK differs' }
          $archive = "$env:RUNNER_TEMP/validator-transfer/publication-validator.zip"
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:VALIDATOR_SHA256) { throw 'Transferred validator bytes differ' }
          Expand-Archive -LiteralPath $archive -DestinationPath "$env:RUNNER_TEMP/validator"
      - uses: actions/download-artifact@v4
        with:
          name: validated-release-${{ inputs.validation-run-id }}-${{ inputs.revision }}
          run-id: ${{ inputs.validation-run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/validated-release
      - name: Reconcile and publish exact validated bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          SCRINIA_NUGET_OWNER: ${{ vars.SCRINIA_NUGET_OWNER }}
          SCRINIA_NUGET_OWNERSHIP_CONFIRMED: ${{ vars.SCRINIA_NUGET_OWNERSHIP_CONFIRMED }}
          SCRINIA_PUBLICATION_APPROVED: 'true'
        run: |
          ./scripts/release/Publish-ValidatedRelease.ps1 -ValidationRunId $env:VALIDATION_RUN_ID -Revision $env:RELEASE_REVISION -Version $env:RELEASE_VERSION -ArtifactRoot "$env:RUNNER_TEMP/validated-release/artifacts" -ProgressPath "$env:RUNNER_TEMP/publication-evidence/progress.json" -ValidatorPath "$env:RUNNER_TEMP/validator/Scrinia.ReleaseTools.dll"
      - name: Retain publication progress even after a partial outcome
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-progress-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-evidence
          if-no-files-found: warn
