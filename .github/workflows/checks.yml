name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  release-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Scrinia.sln -c Release
      - name: Exact skills, version metadata, and workflow targets
        shell: pwsh
        run: ./scripts/release/Check-ReleaseContracts.ps1 -Root . -Configuration Release
      - run: dotnet test Scrinia.sln -c Release --no-build
  xml-doc-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # This promotes emitted CS1591 diagnostics; XML emission/API coverage is not configured.
      - run: dotnet build Scrinia.sln -c Release -warnaserror:CS1591
