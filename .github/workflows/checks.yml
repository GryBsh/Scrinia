name: checks
on: [push, pull_request]
jobs:
  skill-doc-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          count=$(ls src/Scrinia.Mcp/skills/*.md 2>/dev/null | wc -l)
           rows=$(awk '
             /^### Built-in Skills$/ { in_skills=1; next }
             in_skills && /^Built-in skills are/ { print count; exit }
             in_skills && /^\| `[^|]+` \|/ { count++ }
           ' docs/getting-started.md)
           readme_rows=$(awk '
             /^### Built-in skills$/ { in_skills=1; next }
             in_skills && /^Projects can override/ { print count; exit }
             in_skills && /^\| `[^|]+` \|/ { count++ }
           ' README.md)
           echo "skills on disk: $count, getting-started rows: $rows, README rows: $readme_rows"
           test "$count" -eq "$rows"
           test "$count" -eq "$readme_rows"
           test "$count" -eq 7
  version-single-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if grep -R --include="*.cs" --include="*.csproj" "<Version>" src/ | grep -v "Directory.Build.props"; then
            echo "ERROR: literal <Version> outside Directory.Build.props"
            exit 1
          fi
  xml-doc-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: dotnet build Scrinia.sln -c Release -warnaserror:CS1591
